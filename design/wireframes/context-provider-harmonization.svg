<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 400" width="1000" height="400" role="img" aria-labelledby="title description">
  <title id="title">Mixed-provider context panel — overview proposal</title>
  <desc id="description">Source at left and a mixed panel at right. All headers lead with kind. The comment retains OPEN state, its quoted target, coloured author, date and local-origin icon; native notes retain their kind and ID without empty metadata placeholders.</desc>
  <!-- SCREEN: Mixed context overview. STORY: authoring/org/context-provider-harmonization.
       STATE: populated overview. DOMAIN: authoring/org. Content crop only.
       Existing editor chrome, source docking and window geometry are unchanged.
       GRID: body 14px monospace, details 13px, 24px baselines, 16px/two-column
       body inset, one blank text line between items. Colours use existing roles.
       Return/C-m jumps to the item's primary target. ]c/[c moves panel point
       through rendered rows, wrapping, without selecting or scrolling the source.
       Existing ? requests help for the current item. No new buttons or shortcuts.
       Badges and details remain semantic provider content, not framework vocabulary. -->
  <use href="components.svg#template-context-reading" width="1000" height="400"/>
  <use href="components.svg#organism-context-review-source" width="600" height="400"/>
  <g id="context-items">
    <use href="components.svg#molecule-context-review-comment" x="624" y="58" width="376" height="120" data-item-id="review"/>
    <use href="components.svg#organism-context-review-notes" x="624" y="202" width="376" height="144"/>
  </g>
</svg>
