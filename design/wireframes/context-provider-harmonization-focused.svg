<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 400" width="1000" height="400" role="img" aria-labelledby="title description">
  <title id="title">Mixed-provider context panel — focused local thread proposal</title>
  <desc id="description">The focused comment retains its full body and a locally authored reply before the native sidenote and footnote. Reply identity, author colour and comment actions remain intact; common row composition does not turn notes into comments.</desc>
  <!-- SCREEN: Mixed context, focused thread. STORY: authoring/org/context-provider-harmonization.
       STATE: selected comment with one reply. DOMAIN: authoring/org.
       Same grid and navigation as the overview. Existing focus workflow selects
       the comment; this page does not introduce automatic source scrolling on
       panel row movement. Theme-derived highlight colour is illustrative.
       Return on the root uses its source target. Reply actions use reply identity,
       never the root or a neighbouring note. No thread-model or storage changes. -->
