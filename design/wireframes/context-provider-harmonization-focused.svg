<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 400" width="1000" height="400" role="img" aria-labelledby="title description">
  <title id="title">Mixed-provider context — one thread, multiple messages</title>
  <desc id="description">An Open thread has no state marker. Its quoted target appears once, above the root message and two replies. Each message has separate author/date metadata; replies do not acquire thread states. Notes remain icon-led bodies below the conversation.</desc>
  <!-- SCREEN: Mixed context, focused thread. STORY: authoring/org/context-provider-harmonization.
       STATE: focused Open comment with two replies. DOMAIN: authoring/org.
       Thread state belongs beside its quoted target, never beside message authors.
       Existing focused-thread expansion remains; compact overview is unchanged.
       No new source scrolling on panel movement. Reply actions retain reply identity. -->
  <use href="components.svg#template-context-reading" width="1000" height="400"/>
  <rect x="616" y="54" width="376" height="222" fill="#222b40"/>
  <use href="components.svg#organism-context-review-source" width="600" height="400"/>
  <use href="components.svg#molecule-context-review-comment" x="624" y="58" width="376" height="120"/>
  <g id="replies" font-family="monospace" font-size="14" fill="#f3ece3">
    <g data-item-id="review-reply-alice">
      <text x="640" y="168" font-size="13" fill="#9ba5ba">↳ <tspan fill="#9fe0c2">Alice</tspan> · 2026-11-15</text>
      <text x="656" y="192">Yes—I'll add the supporting</text>
      <text x="656" y="216">figure.</text>
    </g>
    <g data-item-id="review-reply-demo">
      <text x="640" y="240" font-size="13" fill="#9ba5ba">↳ <tspan fill="#feacd0">Demo</tspan> · 2026-11-15</text>
      <text x="656" y="264">Thanks, that addresses it.</text>
    </g>
  </g>
  <use href="components.svg#organism-context-review-notes" x="624" y="298" width="376" height="144"/>
</svg>
