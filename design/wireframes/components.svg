<svg xmlns="http://www.w3.org/2000/svg">
  <!-- Shared components for the EMMS docked-player story. Colors follow Emacs faces. -->
  <defs>
    <symbol id="template-emms-player" viewBox="0 0 900 280">
      <rect width="900" height="280" fill="#202020"/>
      <rect y="248" width="900" height="32" fill="#404040"/>
      <text x="16" y="269" font-family="monospace" font-size="14" fill="#ffffff">EMMS Player — shared context-panels bottom slot</text>
    </symbol>
    <symbol id="molecule-emms-controls" viewBox="0 0 880 24">
      <text x="0" y="18" font-family="monospace" font-size="14" fill="#b0b0b0">SPC play/pause · c -10s · r +30s · t next · s previous · v spectrum · q close</text>
    </symbol>
    <symbol id="template-emms-spectrum" viewBox="0 0 900 400">
      <rect width="900" height="400" fill="#202020"/>
      <rect y="368" width="900" height="32" fill="#404040"/>
      <text x="16" y="389" font-family="monospace" font-size="14" fill="#ffffff">EMMS Player — shared context-panels bottom slot</text>
    </symbol>
    <symbol id="template-spotify-library" viewBox="0 0 900 280">
      <rect width="900" height="280" fill="#202020"/>
      <rect width="900" height="30" fill="#404040"/>
      <rect y="248" width="900" height="32" fill="#404040"/>
      <text x="16" y="269" font-family="monospace" font-size="14" fill="#ffffff">Spotify Liked Songs — shared context-panels bottom slot</text>
    </symbol>
    <symbol id="molecule-spotify-library-columns" viewBox="0 0 880 24">
      <text y="18" font-family="monospace" font-size="14" fill="#b0b0b0"><tspan x="0">Title</tspan><tspan x="288">Artist</tspan><tspan x="504">Album</tspan><tspan x="750">Time</tspan></text>
    </symbol>
    <symbol id="template-music-player" viewBox="0 0 900 280">
      <rect width="900" height="280" fill="#202020"/>
      <rect y="248" width="900" height="32" fill="#404040"/>
      <text x="16" y="269" font-family="monospace" font-size="14" fill="#ffffff">Player — shared context-panels bottom slot</text>
    </symbol>
    <symbol id="organism-spotify-sdk-header" viewBox="0 0 800 440">
      <rect width="800" height="440" fill="#f8fafc"/>
      <g font-family="Arial, sans-serif" fill="#172033">
        <text x="40" y="68" font-size="24" font-weight="bold">Spotify SDK compatibility check</text>
        <text x="40" y="104" font-size="14">Chrome receiver only. No Spotify desktop app. EMMS is unchanged.</text>
        <text x="40" y="138" font-size="12">Permissions: streaming, profile/email, playback control.</text>
        <text x="40" y="394" font-size="12">Authorization is held in memory for this session only.</text>
      </g>
    </symbol>
    <symbol id="template-spotify-sdk-probe" viewBox="0 0 800 440">
      <use href="#organism-spotify-sdk-header" width="800" height="440"/>
      <text x="40" y="360" font-family="Arial, sans-serif" font-size="14" fill="#172033">15-second preview; auto pause. Keep this tab open.</text>
    </symbol>
    <symbol id="template-spotify-sdk-ending" viewBox="0 0 800 752">
      <rect width="800" height="752" fill="#f8fafc"/>
      <use href="#organism-spotify-sdk-header" width="800" height="440"/>
      <g font-family="Arial, sans-serif" fill="#172033">
        <text x="40" y="360" font-size="14">Start normally; seek only after you hear music. No EMMS advancement.</text>
        <text x="40" y="438" font-size="14" font-weight="bold">Safe state trace — copy this text only</text>
      </g>
      <rect x="40" y="452" width="720" height="260" rx="5" fill="#e2e8f0"/>
    </symbol>
    <symbol id="template-spotify-browser" viewBox="0 0 800 440">
      <rect width="800" height="440" fill="#f8fafc"/>
      <g font-family="Arial, sans-serif" fill="#172033">
        <text x="40" y="68" font-size="24" font-weight="bold">Emacs Spotify receiver</text>
        <text x="40" y="104" font-size="14">Chrome supplies audio. EMMS owns the playlist. No Spotify desktop app.</text>
        <text x="40" y="138" font-size="12">Permissions: streaming, profile/email, playback control.</text>
        <text x="40" y="180" font-size="14">Edit the mixed playlist and control playback in Emacs.</text>
        <text x="40" y="360" font-size="14">Keep this tab open. Hiding the Emacs player does not stop music.</text>
        <text x="40" y="394" font-size="12">Playback authorization is remembered encrypted in pass. Access tokens stay in memory and renew automatically.</text>
      </g>
    </symbol>
    <symbol id="atom-sdk-probe-button" viewBox="0 0 172 40">
      <rect width="172" height="40" rx="5" fill="currentColor"/>
    </symbol>
    <!-- Music Hi-Fi draft: theme-derived roles; colours below represent a dark theme.
         bg #0d0e1c, surface #171c2c, raised #222b40, ink #f3ece3,
         secondary #c4c8d4, muted #9ba5ba, accent #9fe0c2, warning #f2c68d.
         All track metadata and artwork in these pages are fictional fixtures. -->
    <!-- Spotify mark: unchanged Simple Icons Spotify path, CC0 distribution;
         https://raw.githubusercontent.com/simple-icons/simple-icons/develop/icons/spotify.svg
         Brand use remains subject to Spotify attribution guidelines. -->
    <symbol id="atom-music-spotify" viewBox="0 0 24 24">
      <path fill="#ffffff" d="M12 0C5.4 0 0 5.4 0 12s5.4 12 12 12 12-5.4 12-12S18.66 0 12 0zm5.521 17.34c-.24.359-.66.48-1.021.24-2.82-1.74-6.36-2.101-10.561-1.141-.418.122-.779-.179-.899-.539-.12-.421.18-.78.54-.9 4.56-1.021 8.52-.6 11.64 1.32.42.18.479.659.301 1.02zm1.44-3.3c-.301.42-.841.6-1.262.3-3.239-1.98-8.159-2.58-11.939-1.38-.479.12-1.02-.12-1.14-.6-.12-.48.12-1.021.6-1.141C9.6 9.9 15 10.561 18.72 12.84c.361.181.54.78.241 1.2zm.12-3.36C15.24 8.4 8.82 8.16 5.16 9.301c-.6.179-1.2-.181-1.38-.721-.18-.601.18-1.2.72-1.381 4.26-1.26 11.28-1.02 15.721 1.621.539.3.719 1.02.419 1.56-.299.421-1.02.599-1.559.3z"/>
    </symbol>
    <symbol id="molecule-music-fixture-art" viewBox="0 0 144 144">
      <!-- Original geometric cover fixture, not modified Spotify artwork. -->
      <rect width="144" height="144" fill="#314248"/>
      <circle cx="101" cy="43" r="27" fill="#d4ad83"/>
      <path d="M0 102L72 45 144 116V144H0Z" fill="#5c7c74"/>
      <path d="M0 125L77 76 144 139V144H0Z" fill="#9db9a0"/>
      <path d="M0 140L72 99 118 144H0Z" fill="#d7d5b0"/>
    </symbol>
    <symbol id="molecule-music-spectrum" viewBox="0 0 610 32">
      <path fill="#9fe0c2" d="M0 28h7v4H0z M15 24h7v8h-7z M30 20h7v12h-7z M45 14h7v18h-7z M60 9h7v23h-7z M75 3h7v29h-7z M90 8h7v24h-7z M105 16h7v16h-7z M120 20h7v12h-7z M135 17h7v15h-7z M150 11h7v21h-7z M165 6h7v26h-7z M180 0h7v32h-7z M195 4h7v28h-7z M210 11h7v21h-7z M225 16h7v16h-7z M240 19h7v13h-7z M255 22h7v10h-7z M270 18h7v14h-7z M285 10h7v22h-7z M300 4h7v28h-7z M315 8h7v24h-7z M330 14h7v18h-7z M345 20h7v12h-7z M360 23h7v9h-7z M375 18h7v14h-7z M390 13h7v19h-7z M405 9h7v23h-7z M420 15h7v17h-7z M435 21h7v11h-7z M450 23h7v9h-7z M465 25h7v7h-7z M480 21h7v11h-7z M495 18h7v14h-7z M510 23h7v9h-7z M525 26h7v6h-7z M540 28h7v4h-7z M555 27h7v5h-7z M570 29h7v3h-7z M585 30h7v2h-7z M600 29h7v3h-7z"/>
    </symbol>
    <symbol id="molecule-music-navigation" viewBox="0 0 1280 40">
      <rect width="1280" height="40" fill="#171c2c"/>
      <path d="M0 39.5H1280" stroke="#2c354c"/>
      <g font-family="Ubuntu Mono, monospace" font-size="15" fill="#9ba5ba">
        <text x="28" y="25" fill="#f3ece3" letter-spacing="2">MUSIC</text>
        <text x="150" y="25">Player</text><text x="276" y="25">Liked Songs  'ml</text>
        <text x="510" y="25">Queue  'mq</text><text x="1010" y="25">'m/ Search</text>
        <text x="1160" y="25">? Actions</text>
      </g>
    </symbol>
    <symbol id="atom-music-transport-button" viewBox="0 0 152 27">
      <rect width="152" height="27" rx="5" fill="#222b40"/>
    </symbol>
    <symbol id="molecule-music-controls" viewBox="0 0 1280 43">
      <rect width="1280" height="43" fill="#171c2c"/>
      <path d="M0 .5H1280" stroke="#2c354c"/>
      <!-- First action (SPC) is supplied by the page for the actual state. -->
      <g font-family="Ubuntu Mono, monospace" font-size="16" fill="#aab6ff" data-face="hub/music-console-key">
        <text x="220" y="26">c <tspan fill="#9ba5ba">−10s</tspan></text>
        <text x="345" y="26">r <tspan fill="#9ba5ba">+30s</tspan></text>
        <text x="480" y="26">s <tspan fill="#9ba5ba">Previous</tspan></text>
        <text x="660" y="26">t <tspan fill="#9ba5ba">Next</tspan></text>
        <text x="805" y="26">v <tspan fill="#9ba5ba">Spectrum</tspan></text>
        <text x="930" y="26">l <tspan fill="#9ba5ba">Liked Songs</tspan></text>
        <text x="1060" y="26">? <tspan fill="#9ba5ba">Actions</tspan></text>
        <text x="1170" y="26">q <tspan fill="#9ba5ba">Close</tspan></text>
      </g>
    </symbol>
    <symbol id="organism-music-up-next" viewBox="0 0 330 185">
      <g font-family="Ubuntu Mono, monospace" fill="#9ba5ba" font-size="14">
        <text y="14" letter-spacing="1">UP NEXT</text><text x="230" y="14">3 total</text>
        <text x="28" y="52" fill="#f3ece3" font-size="18">Paper Lanterns</text>
        <text y="52">1</text><text x="278" y="52">3:12</text>
        <text x="28" y="76">Field Recordings · Local</text>
        <text x="28" y="117" fill="#f3ece3" font-size="18">The Long Way Home</text>
        <text y="117">2</text><text x="278" y="117">4:59</text>
        <text x="49" y="141">Northbound · Spotify ↗</text>
        <text y="181">Queue 12:45 · EMMS owns order</text>
      </g>
      <use href="#atom-music-spotify" x="28" y="129" width="16" height="16"/>
    </symbol>
    <symbol id="organism-music-current-track" viewBox="0 0 820 200">
      <use href="#molecule-music-fixture-art" x="28" y="24" width="144" height="144"/>
      <use href="#atom-music-spotify" x="198" y="20" width="20" height="20"/>
      <text x="227" y="36" font-family="Ubuntu Mono, monospace" font-size="15" fill="#c4c8d4">Spotify ↗</text>
      <text x="198" y="74" font-family="ETBembo, Georgia, serif" font-size="38" fill="#f3ece3">Low Light</text>
      <text x="198" y="99" font-family="Ubuntu Mono, monospace" font-size="18" fill="#c4c8d4">Quiet Geometry · Still / Motion</text>
      <rect x="198" y="126" width="610" height="4" rx="2" fill="#2c354c"/>
    </symbol>
    <symbol id="molecule-music-spectrum-off" viewBox="0 0 610 40">
      <text x="0" y="26" font-family="Ubuntu Mono, monospace" font-size="14" fill="#9ba5ba">Spectrum off · v to enable</text>
      <path d="M270 20H610" stroke="#2c354c"/>
    </symbol>
    <symbol id="template-music-console" viewBox="0 0 1280 320">
      <rect width="1280" height="320" fill="#0d0e1c"/>
      <use href="#molecule-music-navigation" width="1280" height="40"/>
      <path d="M150 39H206" stroke="#9fe0c2" stroke-width="2"/>
      <path d="M875 64V244" stroke="#2c354c"/>
      <!-- 16px after the system-mix caption's descender edge; padded footer surface. -->
      <use href="#molecule-music-controls" y="277" width="1280" height="43"/>
    </symbol>
    <symbol id="template-music-workspace" viewBox="0 0 1280 720">
      <rect width="1280" height="720" fill="#0d0e1c"/>
      <g font-family="Ubuntu Mono, monospace" font-size="15" fill="#9ba5ba">
        <text x="48" y="37">WRITING / field-notes.org</text>
        <text x="1204" y="37">ORG</text>
      </g>
      <g font-family="ETBembo, Georgia, serif" fill="#c4c8d4">
        <text x="96" y="113" font-size="38">A quieter workspace</text>
        <text x="96" y="164" font-size="24">The best tools stay within reach without occupying the whole room.</text>
        <text x="96" y="203" font-size="24">A little rhythm, a clear thought, and enough space to keep going.</text>
      </g>
      <rect x="96" y="218" width="2" height="26" fill="#9fe0c2"/>
      <rect y="367" width="1280" height="33" fill="#171c2c"/>
      <text x="28" y="389" font-family="Ubuntu Mono, monospace" font-size="15" fill="#9ba5ba">field-notes.org   Org   Normal</text>
    </symbol>
    <symbol id="template-music-command-surface" viewBox="0 0 1280 320">
      <rect width="1280" height="320" fill="#171c2c"/>
      <path d="M0 .5H1280 M0 278.5H1280" stroke="#2c354c"/>
    </symbol>
    <symbol id="template-music-cockpit-panel" viewBox="0 0 1280 320">
      <rect width="1280" height="320" fill="#0d0e1c"/>
      <use href="#molecule-music-navigation" width="1280" height="40"/>
      <rect y="278" width="1280" height="42" fill="#171c2c"/>
      <text x="28" y="305" font-family="Ubuntu Mono, monospace" font-size="15" fill="#c4c8d4">Playing  Low Light · Quiet Geometry    1:42 / 4:34</text>
    </symbol>
  </defs>
</svg>
